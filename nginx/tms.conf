# ═══════════════════════════════════════════════════════════════
#  /etc/nginx/sites-available/tms.conf
#  TMS — Sistema de Adquisición de Datos  |  IPN
#
#  Arquitectura:
#    Internet/Red local  →  Nginx :443 (HTTPS)
#                        →  /          → archivos estáticos React (/dist)
#                        →  /api/*     → Node.js :4000 (backend MVC)
#
#  Certificados autofirmados generados con:
#    sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#      -keyout /etc/nginx/ssl/tms.key \
#      -out    /etc/nginx/ssl/tms.crt \
#      -subj "/C=MX/ST=CDMX/L=CDMX/O=IPN/OU=ESIME/CN=tms.ipn.local"
# ═══════════════════════════════════════════════════════════════

# ── Redirigir todo el tráfico HTTP → HTTPS ──────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name tms.ipn.local;

    return 301 https://$host$request_uri;
}

# ── Servidor HTTPS principal ─────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name tms.ipn.local;

    # ── Certificados TLS ────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/tms.crt;
    ssl_certificate_key /etc/nginx/ssl/tms.key;

    # Protocolos y cifrados seguros (TLS 1.2 / 1.3)
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    # ── Cabeceras de seguridad ──────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-XSS-Protection          "1; mode=block"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # ── Archivos estáticos de React (build de Vite) ─────────
    # El build se genera con `npm run build` dentro de /frontend
    # y queda en /dist (configurado en vite.config.js → build.outDir)
    root  /opt/tms/dist;
    index index.html;

    # Compresión gzip para assets estáticos
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/wasm;
    gzip_min_length 1024;

    # Cache agresivo para assets con hash de Vite (js, css, woff2…)
    location ~* \.(js|css|woff2?|svg|ico|png|webp)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
    }

    # ── Proxy inverso → Node.js (rutas /api) ────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:4000/;  # Backend MVC
        proxy_http_version 1.1;

        # Cabeceras necesarias para Express y SSE
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # ── Soporte Server-Sent Events (SSE) ────────────────
        # Sin estos ajustes Nginx almacena en buffer el stream
        # y el Dashboard no recibe los eventos en tiempo real.
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;   # 24 h — conexión SSE persistente
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # ── SPA fallback: cualquier ruta desconocida → index.html
    # Permite que React Router maneje el enrutamiento del lado cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Denegar acceso a archivos ocultos (.env, .git, etc.) ─
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Logs ────────────────────────────────────────────────
    access_log /var/log/nginx/tms_access.log;
    error_log  /var/log/nginx/tms_error.log  warn;
}
